services:

  uptime-kuma:
    image: ${IMAGE}
    container_name: ${CONTAINER_NAME}

    restart: unless-stopped

    ports:
      - "${PORT}:3001"

    environment:
      - TZ=${TIMEZONE}

    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - ${NETWORK}

networks:
  ${NETWORK}:
    external: true
