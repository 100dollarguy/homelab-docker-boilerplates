services:

  unbound:
    image: ${UNBOUND_IMAGE}
    container_name: ${UNBOUND_CONTAINER}
    restart: unless-stopped
    networks:
      - ${NETWORK}

  pihole:
    image: ${PIHOLE_IMAGE}
    container_name: ${PIHOLE_CONTAINER}
    restart: unless-stopped

    ports:
      - "${HTTP_PORT}:80"
      - "${DNS_PORT}:53/tcp"
      - "${DNS_PORT}:53/udp"

    environment:
      TZ: ${TIMEZONE}
      WEBPASSWORD: ${WEBPASSWORD}
      DNS1: ${UNBOUND_CONTAINER}#${UNBOUND_PORT}
      DNS2: "no"

    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq:/etc/dnsmasq.d

    depends_on:
      - unbound

    networks:
      - ${NETWORK}

networks:
  ${NETWORK}:
