services:

  npm:
    image: ${IMAGE}
    container_name: ${CONTAINER_NAME}

    restart: unless-stopped

    ports:
      - "${HTTP_PORT}:80"
      - "${ADMIN_PORT}:81"
      - "${HTTPS_PORT}:443"

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

    networks:
      - ${NETWORK}

networks:
  ${NETWORK}:
    name: ${NETWORK}
